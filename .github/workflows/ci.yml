name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" --no-build-isolation

      - name: Lint with ruff
        run: pip install ruff && ruff check src/ --target-version py310

      - name: Collect tests
        run: python -m pytest tests/ --collect-only -q 2>&1 | tail -5

      - name: Run lint regression tests
        run: python -m pytest tests/test_lint_regression.py -v --tb=long

      - name: Run serve tests
        run: python -m pytest tests/test_serve.py -v --tb=long

      - name: Run cli tests
        run: python -m pytest tests/test_cli.py -v --tb=long

      - name: Run all other tests
        run: python -m pytest tests/ --ignore=tests/test_lint_regression.py --ignore=tests/test_serve.py --ignore=tests/test_cli.py -v --tb=long

      - name: Check CLI works
        run: |
          rh-envault --help

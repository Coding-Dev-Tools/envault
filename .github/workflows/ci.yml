name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" --no-build-isolation

      - name: Show installed packages
        run: pip list | grep -E "ruff|pytest|rich|typer|pydantic|cryptography|responses|dotenv"

      - name: Lint with ruff
        run: pip install ruff && ruff check src/ --target-version py310

      - name: Run tests
        id: runtests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest-out.txt
          PYTEST_RC=${PIPESTATUS[0]}
          if [ $PYTEST_RC -ne 0 ]; then
            echo "::error::Tests failed with exit code $PYTEST_RC"
            grep -E "^FAILED|^ERROR" /tmp/pytest-out.txt | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::warning::=== SUMMARY ==="
            tail -30 /tmp/pytest-out.txt | while IFS= read -r line; do
              echo "::warning::$line"
            done
          fi
          exit $PYTEST_RC

      - name: Check CLI works
        run: |
          rh-envault --help

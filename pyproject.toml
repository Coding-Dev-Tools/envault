[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envault"
version = "0.1.0"
description = "Env variable syncing, diffing, and secret rotation CLI with secret-store integrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Revenue Holdings"}]
keywords = ["env", "secrets", "cli", "dotenv", "vault", "aws-ssm", "secret-rotation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Coding-Dev-Tools/envault"
Repository = "https://github.com/Coding-Dev-Tools/envault"
Documentation = "https://github.com/Coding-Dev-Tools/envault#readme"
"Issue Tracker" = "https://github.com/Coding-Dev-Tools/envault/issues"

[project.optional-dependencies]
vault = ["hvac>=2.0.0"]
awsssm = ["boto3>=1.28.0"]
doppler = ["requests>=2.31.0"]
onepassword = ["onepasswordconnectsdk>=1.1.0"]
dev = ["pytest>=7.0", "pytest-cov", "responses>=0.24.0"]
all = [
    "hvac>=2.0.0",
    "boto3>=1.28.0",
    "requests>=2.31.0",
    "onepasswordconnectsdk>=1.1.0",
]

[project.scripts]
envault = "envault.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["*"]
